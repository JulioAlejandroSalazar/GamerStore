<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tienda Gamer</title>

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- css personalizado -->
  <link rel="stylesheet" href="assets/css/Julio_Salazar_CSS_Semana2.css">
</head>
<body>

  <!-- navbar de bootstrap -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
      <a class="navbar-brand" href="#">Tienda Gamer</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
        aria-controls="navbarNav" aria-expanded="false" aria-label="Mostrar/Ocultar navegación">
        <span class="navbar-toggler-icon"></span>
      </button>

      <!-- links del menu -->
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item">
            <a class="nav-link active" aria-current="page" href="#inicio">Inicio</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#productos">Productos</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#contacto">Contacto</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- carousel de bootstrap -->
  <section id="inicio" class="mt-3">
    <div class="container d-flex justify-content-center">
      <div id="carouselExample" class="carousel slide w-50" data-bs-ride="carousel">
        <div class="carousel-inner">
          <div class="carousel-item active" data-bs-interval="3000">
            <img src="https://m.media-amazon.com/images/I/61M3rDwh4qL.png" class="d-block w-100" alt="Tetris">
          </div>
          <div class="carousel-item" data-bs-interval="3000">
            <img
              src="https://play-lh.googleusercontent.com/27O5tpaYE82W6m30rJ_MX3-UvshlDM6O8oXDxb6GseYW2T7P8UNT19727MGmz-0q3w"
              class="d-block w-100" alt="Minecraft">
          </div>
          <div class="carousel-item" data-bs-interval="3000">
            <img
              src="https://images.steamusercontent.com/ugc/794263213710474663/56FC1D9E69A18E93EEF13E56DB5D9718FE046382/?imw=512"
              class="d-block w-100" alt="Super Mario Bros">
          </div>
        </div>
        <button class="carousel-control-prev" type="button" data-bs-target="#carouselExample" data-bs-slide="prev">
          <span class="carousel-control-prev-icon"></span>
        </button>
        <button class="carousel-control-next" type="button" data-bs-target="#carouselExample" data-bs-slide="next">
          <span class="carousel-control-next-icon"></span>
        </button>
      </div>
    </div>

  <!-- productos en grid con cards -->
  <section id="productos" class="container my-5">
    <h2 class="text-center mb-4">Productos destacados</h2>
    <div class="row g-4">
      <!-- las cards se insertan aqui -->
    </div>
  </section>

  <!-- carrito -->
  <section id="carrito" class="container my-5">
    <h2 class="text-center mb-4">Carrito de compras</h2>
    <ul id="lista-carrito" class="list-group mb-3"></ul>
    <p class="fw-bold">Total: $<span id="total">0</span></p>
    <button id="vaciar-carrito" class="btn btn-danger">Vaciar carrito</button>
  </section>


  <!-- formulario de contacto -->
  <section class="container my-5" id="formulario">
    <h2 class="text-center">Contáctanos</h2>
    <form id="form-contacto" class="mt-3">
      <div class="mb-3">
        <label for="nombre" class="form-label">Nombre</label>
        <input type="text" id="nombre" class="form-control" required>
      </div>
      <div class="mb-3">
        <label for="mensaje" class="form-label">Mensaje</label>
        <textarea id="mensaje" class="form-control" rows="3" required></textarea>
      </div>
      <button type="submit" class="btn btn-primary">Enviar</button>
    </form>
  </section>


  <!-- footer -->
  <footer id="contacto" class="bg-dark text-white text-center py-4">
    <p>Dirección: Av Bernardo O'Higgins 123, Santiago</p>
    <p>Síguenos en:
      <a href="https://facebook.com" target="_blank" class="text-white">Facebook</a> |
      <a href="https://twitter.com" target="_blank" class="text-white">Twitter</a> |
      <a href="https://instagram.com" target="_blank" class="text-white">Instagram</a>
    </p>
  </footer>

  

  <!-- scripts de bootstrap -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

  <!-- scripts de js -->
  <script src="assets/js/main.js"></script>
</body>
</html>
